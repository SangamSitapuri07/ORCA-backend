[pytest]
markers =
    live: live-API tests that hit third-party services directly.
          These pass cleanly when run on their own (python -m pytest -m live),
          but Open-Meteo's per-IP rate quota makes them flaky when the whole
          suite fires 40+ live calls in the same minute — so the default
          run excludes them. Everything else is fully offline or caches its
          wire traffic.
addopts = -m "not live"
